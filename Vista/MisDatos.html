
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos - CLUB ACERIAS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f1f1;
            color: #212529;
        }

        header {
            background-color: #111;
            color: white;
            padding: 20px;
        }

        .titulo {
            color: #dc3545;
            font-weight: bold;
        }

        .icono {
            color: rgb(32, 11, 225);
            font-size: 1.3rem;
        }

        .tarjeta {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .dato {
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 10px;
        }

        .modal-header {
            background-color: #111;
            color: white;
        }

        .btn-cancelar {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Encabezado -->
    <header class="text-center">
        <h2>CLUB ACERIAS</h2>
        <p class="mb-0">Información personal del asociado</p>
    </header>

    <div class="container mt-4 mb-5">

        <!-- Volver -->
        <a href="dashboard.html" class="btn btn-outline-dark mb-4">
            <i class="bi bi-arrow-left"></i>
            Volver al Dashboard
        </a>

        <h3 class="titulo mb-4">
            <i class="bi bi-person-circle"></i>
            Mis Datos
        </h3>

        <!-- Mensaje -->
        <div id="mensaje" class="alert alert-info">
            Cargando información...
        </div>

        <!-- Información del asociado -->
        <div id="datosAsociado" class="tarjeta d-none">

            <div class="row g-4">

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-card-text icono"></i>
                        <strong>Documento:</strong>
                        <span id="documento"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-person icono"></i>
                        <strong>Nombres:</strong>
                        <span id="nombres"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-person icono"></i>
                        <strong>Apellidos:</strong>
                        <span id="apellidos"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-calendar icono"></i>
                        <strong>Fecha de nacimiento:</strong>
                        <span id="fechaNacimiento"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-person icono"></i>
                        <strong>Género:</strong>
                        <span id="genero"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-geo-alt icono"></i>
                        <strong>Ciudad:</strong>
                        <span id="ciudad"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-house icono"></i>
                        <strong>Dirección:</strong>
                        <span id="direccionResidencial"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-telephone icono"></i>
                        <strong>Teléfono:</strong>
                        <span id="telefono"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="dato">
                        <i class="bi bi-envelope icono"></i>
                        <strong>Correo:</strong>
                        <span id="email"></span>
                    </div>
                </div>

            </div>

            <!-- Botón editar -->
            <div class="text-center mt-4">

                <button type="button" class="btn btn-primary" id="btnEditar">
                    <i class="bi bi-pencil-square"></i>
                    Editar mis datos
                </button>

            </div>

        </div>

    </div>

    <!-- Modal editar -->
    <div class="modal fade" id="modalEditarDatos" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content text-dark">

                <div class="modal-header">

                    <h5 class="modal-title">
                        <i class="bi bi-pencil-square"></i>
                        Editar mis datos personales
                    </h5>

                    <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="formEditarDatos">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Nombres</label>
                                <input type="text" class="form-control"
                                    id="editNombres" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control"
                                    id="editApellidos" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control"
                                    id="editFechaNacimiento" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Género</label>
                                <input type="text" class="form-control"
                                    id="editGenero" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Ciudad</label>
                                <input type="text" class="form-control"
                                    id="editCiudad" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Dirección de residencia</label>
                                <input type="text" class="form-control"
                                    id="editDireccion" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control"
                                    id="editTelefono" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control"
                                    id="editEmail" required>
                            </div>

                        </div>

                        <div class="text-end mt-4">

                            <button type="button" class="btn btn-cancelar"
                                data-bs-dismiss="modal">
                                Cancelar
                            </button>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i>
                                Guardar cambios
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="../Controladores/MisDatos.js"></script>

</body>
</html>
