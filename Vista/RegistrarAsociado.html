<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Asociado - Club Acerías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f8f9fa; }
    .module-title { color: #b02a37; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="module-title mb-0">Registrar Asociado</h2>
      <a href="asociados.html" class="btn btn-outline-secondary btn-sm px-3">← Volver a Asociados</a>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-9">
        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-body p-4">
            <form id="formAsociado">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="documento" class="form-label">Documento</label>
                  <input type="text" class="form-control" id="documento" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                  <input type="date" class="form-control" id="fechaNacimiento" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="nombres" class="form-label">Nombres</label>
                  <input type="text" class="form-control" id="nombres" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input type="text" class="form-control" id="apellidos" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="genero" class="form-label">Género</label>
                  <select class="form-select" id="genero" required>
                    <option value="">Seleccione...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="ciudad" class="form-label">Ciudad</label>
                  <input type="text" class="form-control" id="ciudad" required />
                </div>
                <div class="col-12 mb-3">
                  <label for="direccionResidencia" class="form-label">Dirección de residencia</label>
                  <input type="text" class="form-control" id="direccionResidencia" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input type="text" class="form-control" id="telefono" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                  <input type="password" class="form-control" id="confirmarPassword" required />
                </div>
              </div>
              <button type="submit" class="btn btn-danger w-100">Guardar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const formAsociado = document.getElementById("formAsociado");

    formAsociado.addEventListener("submit", async (e) => {
      e.preventDefault();

      const ids = ["documento", "nombres", "apellidos", "fechaNacimiento", "genero",
                   "direccionResidencia", "ciudad", "telefono", "email",
                   "password", "confirmarPassword"];
      const datos = {};
      ids.forEach(id => datos[id] = document.getElementById(id).value.trim());

      try {
        const respuesta = await fetch("../Modelos/gestionarAsociados.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });

        if (respuesta.status === 401) {
          window.location.href = "Login.html";
          return;
        }

        const resultado = await respuesta.json();
        if (!respuesta.ok || !resultado.success) {
          throw new Error(resultado.mensaje || "Error al guardar asociado");
        }

        alert("Asociado guardado correctamente");
        window.location.href = "asociados.html";
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
