<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Préstamos - Club Acerías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f8f9fa; }
    .module-title { color: #b02a37; font-weight: 700; }
    .form-label { font-weight: 600; font-size: .9rem; }
    thead.table-dark th { background-color: #212529; color: #fff; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="module-title mb-0">Gestión de Préstamos</h2>
      <a href="dashboard.html" class="btn btn-outline-secondary btn-sm px-3">← Volver al Panel</a>
    </div>

    <!-- FORMULARIO -->
    <div class="row justify-content-center mb-4" id="bloqueForm">
      <div class="col-lg-9">
        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-body p-4">
            <h4 class="module-title text-center mb-4" id="tituloForm">💵 Solicitud de Préstamo</h4>
            <form id="formPrestamo">
              <input type="hidden" id="idPrestamo" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="documento" class="form-label">Documento del Asociado</label>
                  <input type="text" class="form-control" id="documento" placeholder="Ej. 1002345678" required />
                </div>
                <div class="col-md-6">
                  <label for="monto" class="form-label">Monto Solicitado (COP)</label>
                  <input type="number" class="form-control" id="monto" placeholder="$ 0.00" min="0" step="0.01" required />
                </div>
                <div class="col-md-4">
                  <label for="plazo" class="form-label">Plazo (Meses)</label>
                  <input type="number" class="form-control" id="plazo" min="1" required />
                </div>
                <div class="col-md-4">
                  <label for="tasaInteres" class="form-label">Tasa de Interés (%)</label>
                  <input type="number" class="form-control" id="tasaInteres" min="0" step="0.01" required />
                </div>
                <div class="col-md-4">
                  <label for="fechaSolicitud" class="form-label">Fecha de Solicitud</label>
                  <input type="date" class="form-control" id="fechaSolicitud" required />
                </div>
                <div class="col-12">
                  <label for="proposito" class="form-label">Propósito del Préstamo</label>
                  <textarea class="form-control" id="proposito" rows="3" required></textarea>
                </div>
              </div>
              <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
                <button type="submit" id="btnGuardar" class="btn btn-danger px-4">Solicitar Préstamo</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLA -->
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center mb-3 px-1">
          <h5 class="mb-0 fw-bold">🏛️ Solicitudes de Préstamo</h5>
          <span class="badge bg-dark" id="contador">0</span>
        </div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th><th>Documento</th><th>Asociado</th><th>Monto</th><th>Plazo</th>
                <th>Tasa (%)</th><th>Fecha de Solicitud</th><th>Propósito</th><th id="thAcciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaPrestamos">
              <tr><td colspan="9" class="text-center text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const URL_API = "../Modelos/gestionarPrestamos.php";
    const form = document.getElementById("formPrestamo");
    const tbody = document.getElementById("tablaPrestamos");
    const campos = ["documento", "monto", "plazo", "tasaInteres", "fechaSolicitud", "proposito"];
    let prestamos = [];
    let esAdmin = false;

    const escapar = (t) => { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; };
    const moneda = (n) => "$ " + Number(n).toLocaleString("es-CO");

    async function pedir(url, opciones) {
      const r = await fetch(url, opciones);
      if (r.status === 401) { window.location.href = "Login.html"; throw new Error("Sesión expirada"); }
      const data = await r.json();
      if (!r.ok || !data.success) throw new Error(data.mensaje || "Error en la solicitud");
      return data;
    }

    async function cargar() {
      try {
        const data = await pedir(URL_API);
        prestamos = data.prestamos;
        esAdmin = data.rol === "admin";
        document.getElementById("bloqueForm").classList.toggle("d-none", !esAdmin);
        document.getElementById("thAcciones").classList.toggle("d-none", !esAdmin);
        pintar();
      } catch (e) {
        if (e.message !== "Sesión expirada") alert("Error al cargar préstamos: " + e.message);
      }
    }

    function pintar() {
      document.getElementById("contador").textContent = prestamos.length;
      if (!prestamos.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">No hay solicitudes registradas</td></tr>';
        return;
      }
      tbody.innerHTML = prestamos.map((p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escapar(p.documento)}</td>
          <td>${escapar(p.asociado) || "—"}</td>
          <td>${moneda(p.monto)}</td>
          <td>${escapar(p.plazo)} meses</td>
          <td>${escapar(p.tasaInteres)}%</td>
          <td>${escapar(p.fechaSolicitud)}</td>
          <td>${escapar(p.proposito)}</td>
          ${esAdmin ? `<td class="text-nowrap">
            <button class="btn btn-outline-secondary btn-sm" onclick="editar(${p.idPrestamo})">✏️</button>
            <button class="btn btn-outline-danger btn-sm" onclick="eliminar(${p.idPrestamo})">🗑️</button>
          </td>` : ""}
        </tr>`).join("");
    }

    function editar(id) {
      const p = prestamos.find(x => Number(x.idPrestamo) === Number(id));
      if (!p) return;
      document.getElementById("idPrestamo").value = p.idPrestamo;
      campos.forEach(c => document.getElementById(c).value = p[c] ?? "");
      document.getElementById("tituloForm").textContent = "✏️ Editar Préstamo";
      document.getElementById("btnGuardar").textContent = "Guardar cambios";
      document.getElementById("btnCancelar").classList.remove("d-none");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function limpiar() {
      form.reset();
      document.getElementById("idPrestamo").value = "";
      document.getElementById("tituloForm").textContent = "💵 Solicitud de Préstamo";
      document.getElementById("btnGuardar").textContent = "Solicitar Préstamo";
      document.getElementById("btnCancelar").classList.add("d-none");
    }

    async function eliminar(id) {
      if (!confirm("¿Eliminar esta solicitud de préstamo?")) return;
      try {
        await pedir(`${URL_API}?id=${id}`, { method: "DELETE" });
        await cargar();
      } catch (e) { alert("Error: " + e.message); }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = {};
      campos.forEach(c => datos[c] = document.getElementById(c).value.trim());
      const id = document.getElementById("idPrestamo").value;
      if (id) datos.idPrestamo = id;

      try {
        await pedir(URL_API, {
          method: id ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });
        limpiar();
        await cargar();
      } catch (e) { alert("Error: " + e.message); }
    });

    document.getElementById("btnCancelar").addEventListener("click", limpiar);
    cargar();
  </script>
</body>
</html>
