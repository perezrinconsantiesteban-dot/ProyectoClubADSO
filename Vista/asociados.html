<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Asociados - Club Acerías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f8f9fa; }
    .module-title { color: #b02a37; font-weight: 700; }
    thead.table-dark th { background-color: #212529; color: #fff; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="module-title mb-0">Gestión de Asociados</h2>
      <div class="d-flex gap-2">
        <a href="RegistrarAsociado.html" id="btnAgregar" class="btn btn-danger btn-sm px-3 d-none">+ Agregar nuevo</a>
        <a href="dashboard.html" class="btn btn-outline-secondary btn-sm px-3">← Volver al Panel</a>
      </div>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-3">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Documento</th>
                <th>Nombre Completo</th>
                <th>Teléfono</th>
                <th>Correo Electrónico</th>
              </tr>
            </thead>
            <tbody id="tablaAsociados">
              <tr><td colspan="4" class="text-center text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tbody = document.getElementById("tablaAsociados");

    function escapar(texto) {
      const d = document.createElement("div");
      d.textContent = texto ?? "";
      return d.innerHTML;
    }

    async function cargarAsociados() {
      try {
        const respuesta = await fetch("../Modelos/gestionarAsociados.php");

        if (respuesta.status === 401) {
          window.location.href = "Login.html";
          return;
        }

        const data = await respuesta.json();
        if (!data.success) throw new Error(data.mensaje || "No se pudo cargar");

        // Solo el admin ve el botón "Agregar nuevo"
        if (data.rol === "admin") {
          document.getElementById("btnAgregar").classList.remove("d-none");
        }

        if (data.asociados.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No hay asociados registrados</td></tr>';
          return;
        }

        tbody.innerHTML = data.asociados.map(a => `
          <tr>
            <td>${escapar(a.documento)}</td>
            <td>${escapar(a.nombres)} ${escapar(a.apellidos)}</td>
            <td>${escapar(a.telefono)}</td>
            <td>${escapar(a.email)}</td>
          </tr>`).join("");
      } catch (error) {
        alert("Error al cargar asociados: " + error.message);
      }
    }

    cargarAsociados();
  </script>
</body>
</html>
